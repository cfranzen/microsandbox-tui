[package]
name = "microsandbox-tui"
version = "0.1.0"
edition = "2021"
description = "A TUI for managing microsandboxes"
license = "MIT"
repository = "https://github.com/cfranzen/microsandbox-tui"

[dependencies]
microsandbox = { version = "0.6", default-features = false, features = ["net", "prebuilt"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
chrono = "0.4"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
