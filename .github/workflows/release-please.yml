name: Release Please

# Drives releases from Conventional Commits (https://www.conventionalcommits.org/).
# On every push to main, release-please either:
#   - opens/updates a "release PR" that bumps the version in Cargo.toml/Cargo.lock
#     and updates CHANGELOG.md based on commits since the last release, or
#   - if that release PR was just merged, tags the merge commit (vX.Y.Z), creates
#     a GitHub release with generated notes, and reports it via `release_created`.
#
# Publishing the release below triggers .github/workflows/release-binaries.yml,
# which builds and uploads the platform binaries for that tag.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default GITHUB_TOKEN is intentionally prevented by GitHub from
      # triggering other workflows (e.g. release-binaries.yml on `release:
      # published`) to avoid recursive runs. Mint a short-lived GitHub App
      # token instead so the release we publish below actually kicks off the
      # binaries build.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
