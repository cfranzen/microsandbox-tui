name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install system dependencies
        run: sudo apt-get install -y libcap-ng-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download agentd binary (microsandbox-filesystem build dep)
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='microsandbox-filesystem'))")
          curl -fsSL \
            "https://github.com/microsandbox/microsandbox/releases/download/v${VERSION}/agentd-x86_64" \
            -o /tmp/agentd-x86_64
          chmod +x /tmp/agentd-x86_64
          # Place where the build script expects it
          OUT_DIR=$(cargo build 2>&1 | grep 'microsandbox-filesystem' | head -1 | \
            grep -oP 'OUT_DIR=\K[^ ]+' || true)
        continue-on-error: true  # build script may download successfully in CI

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Format check
        run: cargo fmt --check
